name: connect_ong
description: Sistema de doações para ONGs e Empresas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.2.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1          # Gerência de estado
  google_fonts: ^6.2.1      # Fontes profissionais
  google_nav_bar: ^5.0.6    # Opcional, mas útil
  intl: ^0.19.0             # Formatação de datas/moeda
  animations: ^2.0.11       # Transições suaves entre telas

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/